spring.application.name=festival-lineup-tracker



spring.datasource.url=jdbc:mysql://localhost:3306/festival_tracker
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.catalog-import.enabled=false
app.catalog-import.dry-run=false
app.catalog-import.file-path=
